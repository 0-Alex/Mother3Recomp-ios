name: macOS build test
on: workflow_dispatch

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install cmake ninja sdl2 python3
      - name: Prepare pinned source (gbarecomp + recomp-ui)
        run: python3 tools/setup_deps.py
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGBARECOMP_SELFHEAL_RECOMPILE_DEFAULT=OFF
      - name: Build game (compatibility-interpreter build, no ROM-derived code)
        run: cmake --build build --target Mother3Recomp -j3
      - name: Run regression tests
        run: |
          cmake --build build --target host_menu_test presentation_layout_tests touch_input_tests -j3
          ctest --test-dir build -R 'host_menu_test|presentation_layout_tests|touch_input_tests' --output-on-failure
