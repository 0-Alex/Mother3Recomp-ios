name: iOS build (unsigned ipa)
on:
  workflow_dispatch:
    inputs:
      native_asset_id:
        description: "Encrypted native corpus asset on the draft release (empty = interpreter build)"
        required: false
      corpus_sha256:
        description: "SHA256 of the decrypted source archive"
        required: false
permissions:
  contents: write  # draft-release assets are only visible with write access

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake ninja python3

      - name: Prepare pinned source (gbarecomp + recomp-ui)
        run: python3 tools/setup_deps.py

      - name: Patch gbarecomp for iOS
        run: git -C gbarecomp apply ../patches/gbarecomp-ios.patch

      - name: Load private native corpus
        if: inputs.native_asset_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ASSET_ID: ${{ inputs.native_asset_id }}
          CORPUS_SHA256: ${{ inputs.corpus_sha256 }}
          NATIVE_CORPUS_KEY: ${{ secrets.NATIVE_CORPUS_KEY }}
        run: |
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$NATIVE_ASSET_ID" > corpus.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -in corpus.enc -out corpus.tar.gz -pass env:NATIVE_CORPUS_KEY
          echo "$CORPUS_SHA256  corpus.tar.gz" | shasum -a 256 -c -
          tar -xzf corpus.tar.gz
          rm corpus.enc corpus.tar.gz
          test -f generated/dispatch_table.cpp
          test -f gbarecomp/src/runtime/generated_bios/bios_recompiled.cpp

      - name: Configure (iphoneos, arm64)
        run: |
          cmake -S . -B build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DGBARECOMP_SELFHEAL_RECOMPILE_DEFAULT=OFF

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-ios --target Mother3Recomp -j3 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -n -B2 -A12 -E "FAILED:|error:|Undefined symbols|ld: " build.log | head -150 || true

      - name: Package unsigned .ipa
        run: |
          APP=$(find build-ios -maxdepth 2 -name 'Mother3Recomp.app' -type d | head -1)
          test -n "$APP" || { echo "No .app produced"; find build-ios -maxdepth 2 | head -50; exit 1; }
          echo "Bundle: $APP"; ls -la "$APP"
          cp android/game_android_mother3en.toml "$APP/game_ios_mother3en.toml"
          cp ios/AppIcon60x60@2x.png ios/AppIcon60x60@3x.png "$APP/"
          lipo -info "$APP/Mother3Recomp" || true
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Mother3Recomp-unsigned.ipa Payload)
          ls -lh Mother3Recomp-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Mother3Recomp-unsigned-ipa
          path: Mother3Recomp-unsigned.ipa
          if-no-files-found: error

      - name: Upload CMake logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: |
            build-ios/CMakeFiles/CMakeConfigureLog.yaml
            build-ios/CMakeFiles/CMakeError.log
            build-ios/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
